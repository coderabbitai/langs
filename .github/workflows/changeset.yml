name: Add changeset to Renovate updates

on:
  pull_request_target:
    types: [opened, synchronize, labeled]

jobs:
  renovate:
    name: Update Renovate PR
    runs-on: ubuntu-latest
    if: ${{ (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) && (contains(github.event.pull_request.labels.*.name, 'dependencies')) }}

    steps:
      - name: Update PR
        uses: mscharley/dependency-changesets-action@v1.1.4
        with:
          token: ${{ github.token }}
          use-conventional-commits: false
          sign-commits: false
